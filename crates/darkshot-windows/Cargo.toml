[package]
name = "darkshot-windows"
version = "0.4.0"
edition = "2021"
publish = false

[[bin]]
name = "darkshot"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
darkshot-core = { path = "../darkshot-core" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_Security", "Win32_UI_HiDpi", "Win32_Graphics_GdiPlus", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_ErrorReporting", "Win32_Globalization", "Win32_UI_Controls", "Win32_Storage_FileSystem", "Win32_Graphics_Dwm", "Win32_UI_Input_Ime", "Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }

[build-dependencies]
embed-resource = "3.0.12"
